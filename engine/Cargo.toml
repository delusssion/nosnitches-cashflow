[workspace]
resolver = "2"
members = ["crates/cfcore", "crates/cfgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
chrono = "0.4"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1.10"
itoa = "1"
serde_json = "1"
criterion = { version = "0.5", default-features = false }
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
