[workspace]
resolver = "2"
members = ["crates/cfcore", "crates/cfgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
chrono = "0.4"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
